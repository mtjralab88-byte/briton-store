<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | BRITON</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-login" id="loginScreen">
    <div class="admin-login-box">
      <h2>🔐 دخول المدير</h2>
      <form onsubmit="adminLogin(event)">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" id="adminUser" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="adminPass" required>
        </div>
        <button type="submit" class="btn-gold" style="width:100%;">دخول</button>
      </form>
    </div>
  </div>

  <div class="admin-panel" id="adminPanel">
    <div class="admin-header">
      <h1 style="color:var(--gold);">لوحة تحكم BRITON</h1>
      <button class="btn-secondary" onclick="adminLogout()">تسجيل الخروج</button>
    </div>

    <div class="admin-stats">
      <div class="stat-card">
        <div class="stat-num" id="statProducts">0</div>
        <div class="stat-label">المنتجات</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statOrders">0</div>
        <div class="stat-label">الطلبات</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statCategories">0</div>
        <div class="stat-label">التصنيفات</div>
      </div>
    </div>

    <button class="btn-gold" onclick="openProductForm()">➕ إضافة منتج جديد</button>

    <h2 class="section-title" style="margin-top:40px;">المنتجات</h2>
    <div style="overflow-x:auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>الصورة</th>
            <th>الاسم</th>
            <th>السعر</th>
            <th>التصنيف</th>
            <th>الحالة</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="adminProductsTable"></tbody>
      </table>
    </div>

    <h2 class="section-title" style="margin-top:40px;">الطلبات</h2>
    <div style="overflow-x:auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>رقم الطلب</th>
            <th>العميل</th>
            <th>الجوال</th>
            <th>الإجمالي</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="adminOrdersTable"></tbody>
      </table>
    </div>

    <h2 class="section-title" style="margin-top:40px;">إعدادات المتجر</h2>
    <div class="form-container" style="max-width:600px;margin:0;">
      <div class="form-group">
        <label>رقم واتساب المتجر (بصيغة دولية بدون +)</label>
        <input type="text" id="settingWhatsapp" placeholder="966XXXXXXXXX">
      </div>
      <div class="form-group">
        <label>إيميل التواصل</label>
        <input type="email" id="settingEmail">
      </div>
      <button class="btn-gold" onclick="saveSettings()">💾 حفظ الإعدادات</button>
    </div>
  </div>

  <div id="productModal" class="modal">
    <div class="modal-content">
      <h2 style="color:var(--gold);margin-bottom:20px;">منتج جديد / تعديل</h2>
      <form onsubmit="saveProduct(event)">
        <input type="hidden" id="productId">
        <div class="form-group">
          <label>اسم المنتج</label>
          <input type="text" id="productName" required>
        </div>
        <div class="form-group">
          <label>السعر (ر.س)</label>
          <input type="number" id="productPrice" required min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>السعر القديم (اختياري)</label>
          <input type="number" id="productOldPrice" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>رابط الصورة</label>
          <input type="url" id="productImage" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>التصنيف</label>
          <select id="productCategory" style="width:100%;padding:14px;background:var(--navy-dark);border:1px solid rgba(212,175,55,0.3);border-radius:10px;color:var(--white);">
            <option value="ألعاب">ألعاب</option>
            <option value="مستلزمات">مستلزمات</option>
            <option value="هدايا">هدايا</option>
            <option value="عطور">عطور</option>
          </select>
        </div>
        <div class="form-group">
          <label>الوصف</label>
          <textarea id="productDesc" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="productIsNew" style="width:auto;"> منتج جديد
          </label>
          <label>
            <input type="checkbox" id="productOnOffer" style="width:auto;"> عرض خاص
          </label>
        </div>
        <button type="submit" class="btn-gold" style="width:100%;">حفظ</button>
        <button type="button" class="btn-secondary" style="width:100%;margin-top:10px;" onclick="closeProductForm()">إلغاء</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/js/cart.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
